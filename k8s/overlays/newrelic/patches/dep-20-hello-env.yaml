# env changes vs base (strategic merge: matched by env name)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: doodle-hello
  namespace: supreme-doodle
spec:
  template:
    spec:
      containers:
      - name: doodle-hello
        env:
        - name: NEW_RELIC_LICENSE_KEY
          valueFrom:
            secretKeyRef:
              name: nr-license-key
              key: license-key
        - name: NEW_RELIC_APP_NAME
          value: doodle-hello
        - name: ERROR_THRESH
          value: '1'
        - name: WEATHER_HOST
          value: doodle-weather-java
        - name: WEATHER_THRESH
          value: '50'
        - name: W_PORT
          "$patch": delete
