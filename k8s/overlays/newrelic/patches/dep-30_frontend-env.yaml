# env changes vs base (strategic merge: matched by env name)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: doodle-frontend
  namespace: supreme-doodle
spec:
  template:
    spec:
      containers:
      - name: doodle-frontend
        env:
        - name: HELLO_HOST
          value: hello
        - name: WORLD_HOST
          value: world
        - name: WORLD_HOST_RUBY
          value: world-ruby
        - name: RUBY_WORLD
          value: '75'
        - name: NEW_RELIC_LICENSE_KEY
          valueFrom:
            secretKeyRef:
              name: nr-license-key
              key: license-key
        - name: NEW_RELIC_APP_NAME
          value: doodle-frontend
