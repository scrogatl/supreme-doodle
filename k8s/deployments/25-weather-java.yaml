apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: doodle-weather-java
    application: helloworld
    service: doodle-weather-java
    version: blue
    shard: blue
  name: doodle-weather-java
  namespace: supreme-doodle
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: doodle-weather-java
      application: helloworld
      service: doodle-weather-java
      version: blue
      shard: blue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: doodle-weather-java
        application: helloworld
        service: doodle-weather-java
        version: blue
        shard: blue
    spec:
      containers:
      - name: doodle-weather-java
        image: ghcr.io/scrogatl/doodle-weather-java:newrelic
        imagePullPolicy: Always
        env:
        - name: SHARD
          value: "blue"
        - name: NEW_RELIC_LICENSE_KEY
          valueFrom:
            secretKeyRef:
              name: nr-license-key
              key: license-key
        - name: NEW_RELIC_APP_NAME
          value: "doodle-weather-java"
        ports:
        - containerPort: 5100
          name: application
          protocol: TCP
