apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: doodle-hello-otel
    app.kubernetes.io/instance: hello-xyzz
    app.kubernetes.io/version: "0.9.1"
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: helloworld
    app.kubernetes.io/managed-by: kubectl
  name: doodle-hello
  namespace: supreme-doodle
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: doodle-hello-otel
      app.kubernetes.io/instance: hello-xyzz
      app.kubernetes.io/version: "0.9.1"
      app.kubernetes.io/component: service
      app.kubernetes.io/part-of: helloworld
      app.kubernetes.io/managed-by: kubectl
  template:
    metadata:
      labels:
        app.kubernetes.io/name: doodle-hello-otel
        app.kubernetes.io/instance: hello-xyzz
        app.kubernetes.io/version: "0.9.1"
        app.kubernetes.io/component: service
        app.kubernetes.io/part-of: helloworld
        app.kubernetes.io/managed-by: kubectl
    spec:
      containers:
      - name: doodle-hello
        image: ghcr.io/scrogatl/doodle-hello:fastapi
        imagePullPolicy: Always
        command: ["opentelemetry-instrument", "fastapi", "run", "app.py", "--port","5001"]
        env:
        - name: ERROR_THRESH
          value: "10"
        - name: WEATHER_HOST
          value: "doodle-weather"
        - name: W_PORT
          value: "5100"
        - name: WEATHER_THRESH
          value: "25"
        - name: PYTHONUNBUFFERED
          value: "1"
        # 1. Define the Node Name using the Downward API
        - name: KUBE_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        # 2. Define Pod UID and Name
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        # 3. Add host.name to OTEL_RESOURCE_ATTRIBUTES
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "k8s.pod.uid=$(POD_UID),service.instance.id=$(POD_NAME),host.name=$(POD_NAME)"
        - name: OTEL_SERVICE_NAME
          value: "hello-otel-fastapi"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://nr-k8s-otel-collector-gateway.newrelic.svc.cluster.local:4317"
        - name: OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED
          value: "true"
        - name: OTEL_LOGS_EXPORTER
          value: "otlp"
        - name: OTEL_TRACES_EXPORTER
          value: "otlp"
        - name: OTEL_METRICS_EXPORTER
          value: "otlp"

        ports:
        - containerPort: 5001
          name: application
          protocol: TCP
