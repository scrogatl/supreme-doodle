apiVersion: apps/v1
kind: Deployment
metadata:
  name: doodle-frontend
  namespace: supreme-doodle
  labels:
    app.kubernetes.io/name: doodle-frontend-otel
    app.kubernetes.io/instance: frontend-instance
    app.kubernetes.io/version: "0.9.1"
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: helloworld
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: doodle-frontend-otel
      app.kubernetes.io/instance: frontend-instance
      app.kubernetes.io/version: "0.9.1"
      app.kubernetes.io/component: service
      app.kubernetes.io/part-of: helloworld
      app.kubernetes.io/managed-by: kubectl
  template:
    metadata:
      labels:
        app.kubernetes.io/name: doodle-frontend-otel
        app.kubernetes.io/instance: frontend-instance
        app.kubernetes.io/version: "0.9.1"
        app.kubernetes.io/component: service
        app.kubernetes.io/part-of: helloworld
        app.kubernetes.io/managed-by: kubectl
    spec:
      containers:
      - name: doodle-frontend
        image: ghcr.io/scrogatl/doodle-frontend:otel
        imagePullPolicy: Always
        command: ["opentelemetry-instrument", "flask", "run", "--host=0.0.0.0", "-p 5000"]
        env:
        - name: HELLO_HOST
          value: "doodle-hello"
        - name: WORLD_HOST
          value: "doodle-world"
        - name: WORLD_HOST_RUBY
          value: "doodle-world-ruby"
        - name: WPORT
          value: "5002"
        - name: WPORT_RUBY
          value: "5003"
        - name: SHARD
          value: "blue"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: RUBY_WORLD
          value: "50"
        # 1. Define the Node Name using the Downward API
        - name: KUBE_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        # 2. Define Pod UID and Name
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        # 3. Add host.name to OTEL_RESOURCE_ATTRIBUTES
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "k8s.pod.uid=$(POD_UID),service.instance.id=$(POD_NAME),host.name=$(POD_NAME)"
        - name: OTEL_SERVICE_NAME
          value: "frontend-otel"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://nr-k8s-otel-collector-gateway.newrelic.svc.cluster.local:4317"
        - name: OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED
          value: "true"
        - name: OTEL_LOGS_EXPORTER
          value: "otlp"
        - name: OTEL_TRACES_EXPORTER
          value: "otlp"
        - name: OTEL_METRICS_EXPORTER
          value: "otlp"

        ports:
        - containerPort: 5000
          name: application
          protocol: TCP
