apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    application: helloworld
    service: weather
    version: blue
    shard: blue
  name: weather
  namespace: supreme-doodle
spec:
  replicas: 1
  selector:
    matchLabels:
      application: helloworld
      service: weather
      version: blue
      shard: blue
  template:
    metadata:
      labels:
        application: helloworld
        service: weather
        version: blue
        shard: blue
    spec:
      containers:
      - name: weather
        # image: public.ecr.aws/z4m0n1r4/world
        image: ghcr.io/scrogatl/doodle-weather:latest
        imagePullPolicy: Always
        env:
        - name: SHARD
          value: "blue"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: NEW_RELIC_LICENSE_KEY
          valueFrom:
            secretKeyRef:
              name: nr-license-key
              key: license-key
        - name: NEW_RELIC_APP_NAME
          value: "doodle-weather"
        ports:
        - containerPort: 5100
          name: application
          protocol: TCP
