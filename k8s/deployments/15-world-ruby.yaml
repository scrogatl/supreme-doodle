apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: doodle-world-ruby
    app.kubernetes.io/instance: world-ruby-instance
    app.kubernetes.io/version: "0.9.1"
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: helloworld
    app.kubernetes.io/managed-by: kubectl
  name: world-ruby
  namespace: supreme-doodle
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: doodle-world-ruby
      app.kubernetes.io/instance: world-ruby-instance
      app.kubernetes.io/version: "0.9.1"
      app.kubernetes.io/component: service
      app.kubernetes.io/part-of: helloworld
      app.kubernetes.io/managed-by: kubectl
  template:
    metadata:
      labels:
        app.kubernetes.io/name: doodle-world-ruby
        app.kubernetes.io/instance: world-ruby-instance
        app.kubernetes.io/version: "0.9.1"
        app.kubernetes.io/component: service
        app.kubernetes.io/part-of: helloworld
        app.kubernetes.io/managed-by: kubectl
    spec:
      containers:
      - name: world-ruby
        # image: public.ecr.aws/z4m0n1r4/world
        image: ghcr.io/scrogatl/doodle-world-ruby:newrelic
        # image: localhost:32000/gitops-doodle-world-ruby:registry
        imagePullPolicy: Always
        command: ["bundle", "exec", "rackup", "--host", "0.0.0.0", "-p", "5003"]
        env:
        - name: SHARD
          value: "blue"
        # - name: PYTHONUNBUFFERED
        #   value: "1"
        - name: NEW_RELIC_LICENSE_KEY
          valueFrom:
            secretKeyRef:
              name: nr-license-key
              key: license-key
        - name: NEW_RELIC_APP_NAME
          value: "doodle-world-ruby"
        ports:
        - containerPort: 5003
          name: application
          protocol: TCP
      # imagePullSecrets:
      # - name: ghcr-login-secret
