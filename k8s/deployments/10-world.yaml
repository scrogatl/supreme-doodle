apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    application: helloworld
    service: world
    version: blue
    shard: blue
  name: world
  namespace: supreme-doodle
spec:
  replicas: 1
  selector:
    matchLabels:
      application: helloworld
      service: world
      version: blue
      shard: blue
  template:
    metadata:
      labels:
        application: helloworld
        service: world
        version: blue
        shard: blue
    spec:
      containers:
      - name: world
        # image: public.ecr.aws/z4m0n1r4/world
        image: ghcr.io/scrogatl/doodle-world:latest
        imagePullPolicy: Always
        env:
        - name: SHARD
          value: "blue"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: NEW_RELIC_LICENSE_KEY
          valueFrom:
            secretKeyRef:
              name: nr-license-key
              key: license-key
        - name: NEW_RELIC_APP_NAME
          value: "doodle-world"
        ports:
        - containerPort: 5002
          name: application
          protocol: TCP
      # imagePullSecrets:
      # - name: ghcr-login-secret
