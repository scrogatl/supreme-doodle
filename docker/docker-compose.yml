services:
#  ui-frontend:
#    build: ./browser-app
#    image: gitops-doodle-ui
#    container_name: ui-frontend
#    ports:
#      - "8080:80"

  world-ruby:
    build: ./gitops-doodle-world-ruby/
    # image: ghcr.io/scrogatl/doodle-world-ruby:otel
    image: gitops-doodle-world-ruby
    container_name: world-ruby
    ports:
      - "5003:5003"
    environment: 
      - OTEL_SERVICE_NAME=world-ruby-otel
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://nrdot-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
    command: ["bundle", "exec", "rackup", "--host", "0.0.0.0", "-p", "5003"]


  #The NRDOT Collector container
  nrdot-collector:
    #image: newrelic/nrdot-collector
    image: nrdot-collector:latest
    container_name: nrdot-collector
    # Make sure to use your actual license key
    environment:
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}
      - NEW_RELIC_OTLP_ENDPOINT='https://otlp.nr-data.net:4318'
    volumes:
      # This line mounts your local config.yaml into the container.
      # It maps the local file to the path the collector expects internally.
      - /etc/nrdot-collector/config.yaml:/etc/otelcol-contrib/config.yaml
      - /:/hostfs
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8888:8888"

  # # 1. The OpenTelemetry Collector to receive, process, and export traffic
  # otel-collector:
  #   image: otel/opentelemetry-collector-contrib:latest
  #   container_name: otel-collector
  #   command: ["--config=/etc/otel-collector-config.yaml"]
  #   volumes:
  #     - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
  #   ports:
  #     - "4317:4317"   # OTLP gRPC receiver
  #     - "4318:4318"   # OTLP HTTP receiver
  #     - "8888:8888"   # Prometheus metrics exposed by the collector
  #     - "13133:13133" # Health check extension


  telemetrygen:
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:latest
    container_name: telemetrygen
    # depends_on:
      # - otel-collector
    # Configuration sends 10 traces per second indefinitely using gRPC
    command: 
      - "traces"
      - "--traces=10"
      - "--otlp-endpoint=nrdot-collector:4317"
      - "--otlp-insecure"
      - "--rate=10"
      - "--duration=0s" # 0s means run forever

  world:
    # image: ghcr.io/scrogatl/doodle-world:otel
    image: gitops-doodle-world
    build: ./gitops-doodle-world
    container_name: world
    ports:
      - "5002:5002"
    environment: 
      # - SHARD=docker-local
      - OTEL_SERVICE_NAME=world-otel
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://nrdot-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      # ==========================================
      # FORCE ALWAYS-ON SAMPLING (100% of Traces):
      # ==========================================
      # - OTEL_TRACES_SAMPLER=always_on
      # # Instructs Python's root logger and the OTel agent to output WARNING and ERROR logs
      # - OTEL_PYTHON_LOG_LEVEL=warning
      # # Tells the auto-instrumentation script to configure standard Python logging 
      - OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED=true
      # Show the trace details attached to internal logs
      # - OTEL_PYTHON_LOG_CORRELATION=true
    command: ["opentelemetry-instrument", "flask", "run",  "--host=0.0.0.0",  "-p 5002"]
    # command: ["flask",  "run", "--host=0.0.0.0", "-p 5002"]
    # command: opentelemetry-instrument flask run --host=0.0.0.0 -p 5002
    # command: opentelemetry-instrument --logs_exporter otlp flask run --debugger --host=0.0.0.0 -p 5002
    # command: newrelic-admin run-program flask run --host=0.0.0.0 -p 5002

  hello:
    # image: ghcr.io/scrogatl/doodle-hello:otel
    image: gitops-doodle-hello
    build: ./gitops-doodle-hello
    container_name: hello
    ports:
      - "5001:5001"
    environment: 
      - SHARD=docker-local
      - WEATHER_HOST=weather
      - ERROR_THRESH=5
      - WEATHER_THRESH=20
      - OTEL_SERVICE_NAME=hello-otel
      - PYTHONUNBUFFERED=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://nrdot-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      # ==========================================
      # FORCE ALWAYS-ON SAMPLING (100% of Traces):
      # ==========================================
      # - OTEL_TRACES_SAMPLER=always_on
      - OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED=true

    command: ["opentelemetry-instrument", "flask", "run",  "--host=0.0.0.0",  "-p 5001"]
    # command: ["gunicorn",  "app:app", "-b 0.0.0.0:5001", "-p 5001"]
    # command: ["flask",  "run", "--host=0.0.0.0", "-p 5001"]
    # command: opentelemetry-instrument flask run --host=0.0.0.0 -p 5001
    # command: opentelemetry-instrument fastapi run app.py --port 5001
    

  frontend:
    # image: ghcr.io/scrogatl/doodle-frontend:otel
    image: gitops-doodle-frontend
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    build: ./gitops-doodle-frontend
    container_name: frontend  
    environment: 
      - HELLO_HOST=hello
      - HELLO_PORT=443
      - WORLD_HOST=world
      - WPORT=5002
      - WORLD_HOST_RUBY=world-ruby
      - WPORT_RUBY=5003
      - RUBY_WORLD=20
      - PYTHONUNBUFFERED=1
      - OTEL_SERVICE_NAME=frontend-otel
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://nrdot-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      # ==========================================
      # FORCE ALWAYS-ON SAMPLING (100% of Traces):
      # ==========================================
      # - OTEL_TRACES_SAMPLER=always_on
      - OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED=true

    command: ["opentelemetry-instrument", "flask", "run",  "--host=0.0.0.0",  "-p 5000"]
    # command: opentelemetry-instrument flask run --host=0.0.0.0 -p 5000
    # command: ["flask",  "run", "--host=0.0.0.0", "-p 5000"]

  weather:
    # image: ghcr.io/scrogatl/doodle-weather
    image: gitops-doodle-weather
    build: ./gitops-doodle-weather
    container_name: weather
    environment:  
      - SHARD=docker-local
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}

  
  loadgen:
    # image: ghcr.io/scrogatl/doodle-loadgen
    build: ./gitops-doodle-loadgen
    environment: 
      - F_HOST=frontend
      - WORLD_HOST=world
      - SLEEP_TIME=800
      - PYTHONUNBUFFERED=1
      - SHARD=docker-local
