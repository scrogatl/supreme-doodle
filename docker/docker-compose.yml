services:
  world-ruby:
    build:
      context: ../../gitops-doodle-world-ruby
      target: plain
      secrets:
        - extra_ca
    image: doodle-world-ruby:plain
    container_name: world-ruby
    environment: 
      - SHARD=docker-local
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}


  world:
    build:
      context: ../../gitops-doodle-world
      target: plain
      secrets:
        - extra_ca
    image: doodle-world:plain
    container_name: world
    environment: 
      - SHARD=docker-local
      - PYTHONUNBUFFERED=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=https://otlp.nr-data.net
      - OTEL_EXPORTER_OTLP_HEADERS=api-key=
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf 
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}
    # command: opentelemetry-instrument --logs_exporter otlp flask run --debugger --host=0.0.0.0 -p 5002
    # command: newrelic-admin run-program flask run --host=0.0.0.0 -p 5002

  hello:
    build:
      context: ../../gitops-doodle-hello
      target: plain
      secrets:
        - extra_ca
    image: doodle-hello:plain
    container_name: hello
    environment: 
      - SHARD=docker-local
      - WEATHER_HOST=weather
      - PYTHONUNBUFFERED=1
      - ERROR_THRESH=1
      - WEATHER_THRESH=1
      # - OTEL_EXPORTER_OTLP_HEADERS=api-key=${NEW_RELIC_LICENSE_KEY}
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}

  frontend:
    build:
      context: ../../gitops-doodle-frontend
      target: plain
      secrets:
        - extra_ca
    image: doodle-frontend:plain
    container_name: frontend  
    environment: 
      - HELLO_HOST=hello
      - WPORT=5002
      - WORLD_HOST=world
      - WORLD_HOST_RUBY=world-ruby
      - WPORT_RUBY=5003
      - SHARD=docker-local
      - PYTHONUNBUFFERED=1
      - RUBY_WORLD=50
      # - OTEL_EXPORTER_OTLP_HEADERS=api-key=
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}

  weather:
    build:
      context: ../../gitops-doodle-weather
      target: plain
      secrets:
        - extra_ca
    image: doodle-weather:plain
    container_name: weather
    environment:
      - SHARD=docker-local
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}

  weather-java:
    build:
      context: ../../gitops-doodle-weather-java
      target: plain
      secrets:
        - extra_ca
    image: doodle-weather-java:plain
    container_name: weather-java
    environment:
      - SHARD=docker-local
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}

  
  loadgen:
    build:
      context: ../../gitops-doodle-loadgen
      secrets:
        - extra_ca
    image: doodle-loadgen:local
    environment: 
      - F_HOST=frontend
      - WORLD_HOST=world
      - SLEEP_TIME=16000
      - PYTHONUNBUFFERED=1
      - SHARD=docker-local

# Optional CA bundle trusted during image builds, for networks that intercept TLS.
#   export EXTRA_CA_FILE=$PWD/certs/extra-ca.pem
# Unset = empty file = no-op. Put the PEM in docker/certs/ (gitignored).
secrets:
  extra_ca:
    file: ${EXTRA_CA_FILE:-/dev/null}
